name: FAST9 author approval desk
on:
  pull_request:
    paths:
      - 'apps/delivery_queue/**'
      - 'apps/delivery_planner/**'
      - 'apps/fast9_case_source_join/**'
      - 'tests/delivery_queue/**'
      - 'tools/dev/author_desk*'
      - 'config/settings/delivery_author*'
      - 'templates/delivery_queue/**'
      - '.github/workflows/fast9-author-approval-desk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: author-desk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  author-desk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: wave7_synthetic
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: wave7_synthetic_author_desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wave7_synthetic -d wave7_synthetic_author_desk"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FATWA_PRODUCTION: '0'
      FATWA_WAVE7_SYNTHETIC_WRITES: '1'
      DJANGO_SETTINGS_MODULE: config.settings.delivery_queue_test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: wave7_synthetic
      PGPASSWORD: synthetic-only
      PGDATABASE: wave7_synthetic_author_desk
      PGTESTDATABASE: test_wave7_synthetic_author_desk
      PG_EXPECTED_MAJOR: ${{ matrix.postgres }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-deps -r requirements.txt
      - name: Verify revision and syntax
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m compileall -q apps/delivery_queue tests/delivery_queue tools/dev/author_desk_acceptance.py tools/dev/author_desk_browser.py
      - name: Initialize only the fresh owned synthetic database
        run: |
          python - <<'PY'
          import os, django
          django.setup()
          from django.db import connection
          from apps.intake_workflow.guards import initialize_synthetic_database
          with connection.cursor() as cursor:
              cursor.execute("SELECT current_setting('server_version_num')::int / 10000")
              assert cursor.fetchone()[0] == int(os.environ['PG_EXPECTED_MAJOR'])
          initialize_synthetic_database(synthetic_fixtures_only=True)
          PY
      - name: Verify schema
        run: |
          python manage.py migrate --noinput --settings=config.settings.delivery_queue_test
          python manage.py makemigrations --check --dry-run --settings=config.settings.delivery_queue_test
      - name: Exact-revision acceptance
        run: |
          mkdir -p .local/qa/trusted-journey
          python tools/dev/author_desk_acceptance.py 2>&1 | tee .local/qa/trusted-journey/author-tests.log
      - name: Native author browser workflow
        if: matrix.postgres == '17'
        env:
          FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
        run: |
          python -m pip install --only-binary=:all: --no-deps playwright==1.62.0 pyee==13.0.1 greenlet==3.5.5
          test -x "$FATWA_FASTBUILD_BROWSER"
          python tools/dev/author_desk_browser.py 2>&1 | tee .local/qa/trusted-journey/author-browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: author-desk-pg${{ matrix.postgres }}
          path: .local/qa/trusted-journey
          include-hidden-files: true
          if-no-files-found: error
