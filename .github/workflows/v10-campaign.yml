name: V10 connected product and recovery
on:
  pull_request:
    paths:
      - 'apps/mufti_workspace/**'
      - 'apps/requester_portal/**'
      - 'apps/library_preview/**'
      - 'apps/platform_recovery/**'
      - 'infra/dev/v10_demo.py'
      - 'infra/dev/v10_verify.py'
      - 'tests/casework/v10_*.py'
      - 'templates/casework/base.html'
      - 'apps/case_attachments/**'
      - 'apps/case_citations/**'
      - 'apps/answer_media/**'
      - 'apps/private_media/**'
      - 'apps/source_case_intake/**'
      - 'apps/knowledge_links/**'
      - 'apps/composite_delivery/**'
      - 'apps/delivery_planner/**'
      - 'apps/delivery_queue/**'
      - 'apps/experimental_publication/**'
      - 'tests/casework/test_v10*.py'
      - 'apps/team_workspace/**'
      - 'templates/team_workspace/**'
      - 'templates/casework/requester_workspace.html'
      - 'apps/casework/**'
      - 'apps/casework_web/**'
      - 'apps/requester_access_review/**'
      - 'apps/requester_team_journey/**'
      - 'apps/team_updates/**'
      - 'apps/case_delivery_desk/**'
      - 'tests/case_delivery_desk/**'
      - 'templates/requester_access_review/**'
      - 'config/campaign_urls.py'
      - 'config/settings/campaign_review.py'
      - 'config/settings/casework*.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'tests/casework/test_campaign*.py'
      - '.github/workflows/v10-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    env:
      FATWA_PRODUCTION: '0'
      FATWA_WAVE7_SYNTHETIC_WRITES: '1'
      DJANGO_SETTINGS_MODULE: apps.platform_recovery.v12_recovery_v10_test_settings
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PG_EXPECTED_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned runtime
        run: python -m pip install --no-deps -r requirements.txt
      # Match pg_dump/pg_restore to the service major; the runner default may be older.
      # Official packages: https://www.postgresql.org/download/linux/ubuntu/
      - name: Install matching PostgreSQL drill server and clients
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/fatwa-pgdg.asc
          test "$(gpg --batch --show-keys --with-colons /tmp/fatwa-pgdg.asc | awk -F: '$1 == "fpr" {print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 644 /tmp/fatwa-pgdg.asc /usr/share/keyrings/fatwa-pgdg.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/keyrings/fatwa-pgdg.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/fatwa-pgdg.list
          sudo apt-get update -qq
          sudo install -d /etc/postgresql-common
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf
          sudo apt-get install -y --no-install-recommends "postgresql-$PG_EXPECTED_MAJOR"
          printf '/usr/lib/postgresql/%s/bin\n' "$PG_EXPECTED_MAJOR" >> "$GITHUB_PATH"
      - name: Install browser driver on the browser matrix leg
        if: matrix.postgres == '17'
        run: |
          python -m pip install --only-binary=:all: --no-deps playwright==1.62.0 pyee==13.0.1 greenlet==3.5.5
      - name: Verify connected product and full recovery in fresh owned clusters
        env:
          FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
          FATWA_BROWSER_SANDBOX: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          extra=()
          if [ "$PG_EXPECTED_MAJOR" = 17 ]; then extra+=(--browser); fi
          python infra/dev/with_casework_postgres.py \
            --pg-bin "/usr/lib/postgresql/$PG_EXPECTED_MAJOR/bin" \
            --major "$PG_EXPECTED_MAJOR" --settings apps.platform_recovery.v12_recovery_v10_test_settings -- \
            python infra/dev/v10_verify.py --pg-bin "/usr/lib/postgresql/$PG_EXPECTED_MAJOR/bin" "${extra[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v10-campaign-pg${{ matrix.postgres }}
          path: |
            .local/qa/v10
            .local/qa/v10/browser
          include-hidden-files: true
          if-no-files-found: error
