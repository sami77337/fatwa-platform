name: V6 recovered Arabic search relevance
on:
  pull_request:
    paths:
      - 'apps/editorial_search/**'
      - 'apps/editorial_workbench/author_queue.py'
      - 'apps/editorial_workbench/search_terms.py'
      - 'templates/editorial_search/**'
      - 'tests/editorial_search/**'
      - 'tests/editorial_workbench/test_search_terms.py'
      - '.github/workflows/fast9-arabic-relevance.yml'
permissions:
  contents: read
jobs:
  relevance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-deps -r requirements.txt
      - name: Verify exact tested revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Recovered search and HTTP regressions
        run: >-
          python manage.py test
          tests.editorial_search.test_services tests.editorial_search.test_views
          tests.editorial_search.test_relevance tests.editorial_search.test_query_terms
          tests.editorial_workbench.test_search_terms
          --settings=config.settings.test --noinput --verbosity=2
