name: FAST9 Mufti review cycle
on:
  pull_request:
    paths:
      - 'apps/mufti_review/**'
      - 'apps/delivery_queue/**'
      - 'apps/delivery_planner/**'
      - 'tests/mufti_review/**'
      - 'tools/dev/mufti_review*'
      - 'config/settings/mufti_review*'
      - 'templates/mufti_review/**'
      - '.github/workflows/fast9-mufti-review-cycle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mufti-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: wave7_synthetic
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: wave7_synthetic_mufti_review
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wave7_synthetic -d wave7_synthetic_mufti_review"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FATWA_PRODUCTION: '0'
      FATWA_WAVE7_SYNTHETIC_WRITES: '1'
      DJANGO_SETTINGS_MODULE: config.settings.mufti_review_test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: wave7_synthetic
      PGPASSWORD: synthetic-only
      PGDATABASE: wave7_synthetic_mufti_review
      PGTESTDATABASE: test_wave7_synthetic_mufti_review
      PG_EXPECTED_MAJOR: ${{ matrix.postgres }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-deps -r requirements.txt
      - name: Check exact revision and syntax
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m compileall -q apps/mufti_review tests/mufti_review tools/dev/mufti_review_acceptance.py tools/dev/mufti_review_browser.py
      - name: Claim only the isolated empty synthetic DB
        run: |
          python - <<'PY'
          import os, django
          django.setup()
          from django.db import connection
          from apps.intake_workflow.guards import initialize_synthetic_database
          with connection.cursor() as c:
              c.execute("SELECT current_setting('server_version_num')::int / 10000")
              assert c.fetchone()[0] == int(os.environ['PG_EXPECTED_MAJOR'])
          initialize_synthetic_database(synthetic_fixtures_only=True)
          PY
      - name: Apply synthetic schema and check migration state
        run: |
          python manage.py migrate --noinput --settings=config.settings.mufti_review_test
          python manage.py makemigrations --check --dry-run --settings=config.settings.mufti_review_test
      - name: Review cycle and inherited regression acceptance
        run: |
          set -euo pipefail
          mkdir -p .local/qa/trusted-journey
          python tools/dev/mufti_review_acceptance.py 2>&1 | tee .local/qa/trusted-journey/mufti-tests.log
      - name: Real author and Mufti browser round trip
        if: matrix.postgres == '17'
        env:
          FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --no-deps playwright==1.62.0 pyee==13.0.1 greenlet==3.5.5
          test -x "$FATWA_FASTBUILD_BROWSER"
          python tools/dev/mufti_review_browser.py 2>&1 | tee .local/qa/trusted-journey/mufti-browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mufti-review-pg${{ matrix.postgres }}
          path: .local/qa/trusted-journey
          include-hidden-files: true
          if-no-files-found: error
