name: Case source history and draft review
on:
  push:
    branches: [codex/20261107-draft-source-review-check]

permissions:
  contents: read

jobs:
  source-review:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PGPORT: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned project packages
        run: python -m pip install --no-deps -r requirements.txt
      - name: Verify the source, draft and reviewer screen on this commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import unittest

          import django
          from django.test.utils import setup_test_environment, teardown_test_environment

          django.setup()
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if sha != os.environ["GITHUB_SHA"]:
              raise SystemExit("Unexpected checkout SHA")
          modules = [
              "tests.fast9_case_source_join.test_source_history",
              "tests.fast9_case_source_join.test_draft_source_review",
              "tests.editorial_workbench.test_source_review",
          ]
          suites = [unittest.defaultTestLoader.loadTestsFromName(name) for name in modules]

          class Evidence(unittest.TextTestResult):
              def addSuccess(self, test):
                  passed.append(test.id())
                  super().addSuccess(test)

          passed = []
          selected = [s.countTestCases() for s in suites]
          setup_test_environment()
          try:
              result = unittest.TextTestRunner(verbosity=2, resultclass=Evidence).run(unittest.TestSuite(suites))
          finally:
              teardown_test_environment()
          ok = (
              all(count > 0 for count in selected)
              and result.wasSuccessful() and result.testsRun == sum(selected) == len(passed) == len(set(passed))
              and all(sum(t.startswith(name + ".") for t in passed) == count for name, count in zip(modules, selected))
          )
          receipt = {
              "sha": sha, "runner": os.environ["RUNNER_OS"], "modules": dict(zip(modules, selected)),
              "executed": result.testsRun, "passed": sorted(passed), "result": "PASS" if ok else "FAIL",
          }
          Path("case-source-result.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          raise SystemExit(0 if ok else 1)
          PY
      - name: Run the guarded screen in sandboxed system Chrome
        if: runner.os == 'Linux'
        shell: bash
        env:
          FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
        run: |
          python -m pip install --only-binary=:all: --no-deps playwright==1.62.0 pyee==13.0.1 greenlet==3.5.5
          python -m tests.editorial_workbench.source_review_browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: source-review-${{ matrix.os }}
          path: |
            case-source-result.json
            case-source-browser.json
          if-no-files-found: error
