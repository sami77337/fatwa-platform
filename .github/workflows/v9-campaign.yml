name: V9 origin knowledge and connected workflows
on:
  pull_request:
    paths:
      - 'apps/case_attachments/**'
      - 'apps/case_citations/**'
      - 'apps/answer_media/**'
      - 'apps/private_media/**'
      - 'apps/source_case_intake/**'
      - 'apps/knowledge_links/**'
      - 'apps/composite_delivery/**'
      - 'apps/delivery_planner/**'
      - 'apps/delivery_queue/**'
      - 'apps/experimental_publication/**'
      - 'tests/casework/test_v9*.py'
      - 'apps/team_workspace/**'
      - 'templates/team_workspace/**'
      - 'templates/casework/requester_workspace.html'
      - 'apps/casework/**'
      - 'apps/casework_web/**'
      - 'apps/requester_access_review/**'
      - 'apps/requester_team_journey/**'
      - 'apps/team_updates/**'
      - 'apps/case_delivery_desk/**'
      - 'tests/case_delivery_desk/**'
      - 'templates/requester_access_review/**'
      - 'config/campaign_urls.py'
      - 'config/settings/campaign_review.py'
      - 'config/settings/casework*.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'tests/casework/test_campaign*.py'
      - '.github/workflows/v9-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: wave7_synthetic
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: wave7_synthetic_v9campaign
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wave7_synthetic -d wave7_synthetic_v9campaign"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FATWA_PRODUCTION: '0'
      FATWA_WAVE7_SYNTHETIC_WRITES: '1'
      DJANGO_SETTINGS_MODULE: config.settings.campaign_review
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: wave7_synthetic
      PGPASSWORD: synthetic-only
      PGDATABASE: wave7_synthetic_v9campaign
      PGTESTDATABASE: test_wave7_synthetic_v9campaign
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PG_EXPECTED_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned runtime
        run: python -m pip install --no-deps -r requirements.txt
      - name: Initialize fresh synthetic database and verify tested head
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p .local/qa/v9
          python - <<'PY'
          import os
          import django
          django.setup()
          from django.db import connection
          from apps.intake_workflow.guards import initialize_synthetic_database
          with connection.cursor() as cursor:
              cursor.execute("SELECT current_setting('server_version_num')::int / 10000")
              assert str(cursor.fetchone()[0]) == os.environ['PG_EXPECTED_MAJOR']
          initialize_synthetic_database(synthetic_fixtures_only=True)
          PY
          python manage.py migrate --noinput
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Focused V9 functionality and connected security contracts
        run: |
          set -euo pipefail
          python manage.py test apps.source_case_intake.tests apps.knowledge_links.tests apps.composite_delivery.tests apps.private_media.tests apps.private_media.filesystem_tests apps.case_attachments.tests apps.case_attachments.media_tests apps.case_attachments.storage_gc_tests apps.answer_media.tests apps.answer_media.tests_storage apps.case_citations.tests apps.case_citations.composer_tests apps.case_citations.preservation_tests apps.case_citations.research_tests tests.casework.test_v9_integration tests.casework.test_v9_requester tests.casework.test_v9_library tests.casework.test_v9_composite_requester apps.requester_access_review.tests.SignedDeliveryRequesterViewTests tests.casework.test_delivery.CaseDeliveryTests.test_journey_binds_human_answer_all_signed_parts_and_private_case tests.casework.test_delivery.CaseDeliveryTests.test_guard_migration_preserves_populated_bindings_and_signed_evidence --noinput --verbosity 2 2>&1 | tee .local/qa/v9/tests.log
      - name: Real Chrome with browser sandbox
        if: matrix.postgres == '17'
        env:
          FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --no-deps playwright==1.62.0 pyee==13.0.1 greenlet==3.5.5
          python manage.py test tests.casework.test_v9_browser --noinput --verbosity 2 2>&1 | tee .local/qa/v9/browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v9-campaign-pg${{ matrix.postgres }}
          path: |
            .local/qa/v9
            .local/qa/v9/browser
          include-hidden-files: true
          if-no-files-found: error
