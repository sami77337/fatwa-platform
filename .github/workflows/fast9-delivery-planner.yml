name: FAST9 capability-aware delivery planner
on:
  push:
    paths:
      - 'apps/delivery_planner/**'
      - 'tests/delivery_planner/**'
      - '.github/workflows/fast9-delivery-planner.yml'
  pull_request:
    paths:
      - 'apps/delivery_planner/**'
      - 'tests/delivery_planner/**'
      - '.github/workflows/fast9-delivery-planner.yml'
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pure delivery decision checks
        run: python -m unittest tests.delivery_planner.test_planner -v
