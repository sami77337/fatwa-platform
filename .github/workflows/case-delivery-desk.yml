name: Case delivery desk synthetic journey
on:
  pull_request:
    paths:
      - 'apps/case_delivery_desk/**'
      - 'tests/case_delivery_desk/**'
      - '.github/workflows/case-delivery-desk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery-desk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: wave7_synthetic
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: wave7_synthetic_deliverydesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wave7_synthetic -d wave7_synthetic_deliverydesk"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FATWA_PRODUCTION: '0'
      FATWA_WAVE7_SYNTHETIC_WRITES: '1'
      DJANGO_SETTINGS_MODULE: config.settings.casework_test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: wave7_synthetic
      PGPASSWORD: synthetic-only
      PGDATABASE: wave7_synthetic_deliverydesk
      PGTESTDATABASE: test_wave7_synthetic_deliverydesk
      PG_EXPECTED_MAJOR: ${{ matrix.postgres }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned runtime
        run: python -m pip install --no-deps -r requirements.txt
      - name: Verify exact head and initialize owned database
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p .local/qa/case-delivery-desk
          python - <<'PY'
          import os
          import django
          django.setup()
          from django.db import connection
          from apps.intake_workflow.guards import initialize_synthetic_database
          with connection.cursor() as cursor:
              cursor.execute("SELECT current_setting('server_version_num')::int / 10000")
              assert cursor.fetchone()[0] == int(os.environ['PG_EXPECTED_MAJOR'])
          initialize_synthetic_database(synthetic_fixtures_only=True)
          PY
          python manage.py migrate --noinput
      - name: Affected HTTP and service contracts
        run: |
          set -euo pipefail
          python manage.py test tests.case_delivery_desk.test_http tests.casework.test_delivery tests.casework.test_delivery_reconciliation --noinput --verbosity=2 2>&1 | tee .local/qa/case-delivery-desk/http-services.log
      - name: Real Chrome mobile and desktop native forms
        if: matrix.postgres == '17'
        env:
          FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --no-deps playwright==1.62.0 pyee==13.0.1 greenlet==3.5.5
          test -x "$FATWA_FASTBUILD_BROWSER"
          python manage.py test tests.case_delivery_desk.test_browser --noinput --verbosity=2 2>&1 | tee .local/qa/case-delivery-desk/browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: case-delivery-desk-pg${{ matrix.postgres }}
          path: .local/qa/case-delivery-desk
          include-hidden-files: true
          if-no-files-found: error
