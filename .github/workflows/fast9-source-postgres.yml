name: FAST9 Wave7 case-source PostgreSQL
on:
  push:
    branches: [codex/20261107-fast9-case-source-pg-ci]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-bookworm
        env:
          POSTGRES_DB: wave7_synthetic_fast9_case_source_join
          POSTGRES_USER: wave7_synthetic
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, matrix.postgres) }}
        ports: ['127.0.0.1:55443:5432']
        options: >-
          --health-cmd "pg_isready -U wave7_synthetic -d wave7_synthetic_fast9_case_source_join"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.wave7_test
      FATWA_PRODUCTION: '0'
      FATWA_WAVE7_SYNTHETIC_WRITES: '1'
      PGHOST: 127.0.0.1
      PGPORT: '55443'
      PGDATABASE: wave7_synthetic_fast9_case_source_join
      PGTESTDATABASE: test_wave7_synthetic_fast9_case_source_join
      PGUSER: wave7_synthetic
      PGPASSWORD: ${{ format('ci-{0}-{1}', github.run_id, matrix.postgres) }}
      FATWA_FAST9_CASE_SOURCE_JOIN_PG: '1'
      FATWA_WAVE7_SYNTHETIC_READS: '1'
      EXPECTED_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-deps -r requirements.txt
      - name: Claim the reserved empty service using Wave7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          python -B - <<'PY' | tee "$RUNNER_TEMP/source/base-before.json"
          import django
          django.setup()
          import json, os
          from django.db import connection
          from apps.intake_workflow.guards import initialize_synthetic_database
          from tools.fast9_case_source_join.postgresql import BASE_DATABASE, TEST_DATABASE, require_target as validate_environment
          validate_environment(os.environ)
          assert os.environ['PGPORT'] == '55443'
          with connection.cursor() as c:
              c.execute("SELECT current_database(), current_user, current_setting('server_version_num')::int, oid, datdba=current_user::regrole FROM pg_database WHERE datname=current_database()")
              name, role, version, oid, owns = c.fetchone()
              assert (name, role, version // 10000, owns) == (BASE_DATABASE, 'wave7_synthetic', int(os.environ['EXPECTED_MAJOR']), True)
              c.execute("SELECT 1 FROM pg_database WHERE datname=%s", [TEST_DATABASE])
              assert c.fetchone() is None
          ctx = initialize_synthetic_database(synthetic_fixtures_only=True)
          assert (ctx.database_name, ctx.database_oid) == (name, oid)
          print(json.dumps(dict(sha=os.environ['GITHUB_SHA'], name=name, role=role, version=version, oid=oid, test_absent=True)))
          PY
          python -B manage.py migrate --noinput --settings=config.settings.wave7_test
      - name: Run both case-source acceptance cases
        id: acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -B -m tools.fast9_case_source_join.postgresql 2>&1 | tee "$RUNNER_TEMP/source/test.log"
          grep -Eq '^Ran 2 tests in ' "$RUNNER_TEMP/source/test.log"
          grep -Fxq 'OK' "$RUNNER_TEMP/source/test.log"
      - name: Verify owned base and teardown
        if: ${{ !cancelled() && steps.acceptance.outcome != 'skipped' }}
        env:
          ACCEPTANCE: ${{ steps.acceptance.outcome }}
        shell: bash
        run: |
          python -B - <<'PYCODE'
          import django
          django.setup()
          import json, os
          from pathlib import Path
          from django.db import connection
          from apps.intake_workflow.guards import require_synthetic_write
          from tools.fast9_case_source_join.postgresql import TEST_DATABASE
          dest = Path(os.environ['RUNNER_TEMP']) / 'source'
          base = json.loads((dest / 'base-before.json').read_text())
          ctx = require_synthetic_write(synthetic_fixtures_only=True)
          assert (ctx.database_name, ctx.database_oid) == (base['name'], base['oid'])
          with connection.cursor() as c:
              c.execute("SELECT 1 FROM pg_database WHERE datname=%s", [TEST_DATABASE])
              assert c.fetchone() is None
          receipt = dict(base=base, acceptance=os.environ['ACCEPTANCE'], test_absent_after=True)
          (dest / 'result.json').write_text(json.dumps(receipt, indent=2))
          PYCODE
      - name: Retain version-specific proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fast9-source-pg${{ matrix.postgres }}
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
