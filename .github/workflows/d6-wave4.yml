name: D6 Wave4 functional acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  functional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests/dev -p 'test_*.py' -v
      - run: python tools/dev/wave4_qa.py --wave3 --reports .local/qa/d6 --json wave4-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave4-${{ matrix.os }}
          path: |
            wave4-summary.json
            .local/qa/d6/*.json
          include-hidden-files: true
          if-no-files-found: error
