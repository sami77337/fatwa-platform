name: D6 Wave4 functional acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  functional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests/dev -p 'test_*.py' -v
      - run: python tools/dev/wave4_qa.py --wave3 --reports .local/qa/d6 --json wave4-summary.json
      - name: Require real Chrome for FAST6 journey
        if: runner.os == 'Linux'
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          node --version
      - name: FAST6 real Chrome journey (fixed synthetic catalog)
        if: runner.os == 'Linux'
        env:
          FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
        run: python -B manage.py test tests.fast6_journey.test_browser --settings=config.settings.test --noinput --verbosity=2
      - name: FAST8 explicit operator and browser conformance suites
        if: runner.os == 'Linux'
        env:
          FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .local/qa/d6
          python -B manage.py test tests.fast8_operator_nav.test_browser tests.fast8_browser_conformance.test_conformance --settings=config.settings.test --noinput --verbosity=2 2>&1 | tee .local/qa/d6/fast8-browser.log
          python - <<'PYCODE'
          from pathlib import Path
          text = Path('.local/qa/d6/fast8-browser.log').read_text(encoding='utf-8')
          assert 'Ran 14 tests' in text, 'FAST8 browser collection changed or did not execute'
          assert 'skipped' not in text.lower().replace('# skipped 0', ''), 'FAST8 browser suite must execute without skips'
          PYCODE
      - name: FAST7B guarded real Chrome editorial acceptance
        if: runner.os == 'Linux'
        env:
          FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
          FATWA_FASTBUILD_ARTIFACTS: .local/qa/d6/fast7bc
        run: python -B manage.py test tests.acceptance.fastbuild.test_browser --settings=config.settings.test --noinput --verbosity=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave4-${{ matrix.os }}
          path: |
            wave4-summary.json
            .local/qa/d6/*.json
            .local/qa/d6/fast8-browser.log
            .local/qa/d6/fast7bc/
          include-hidden-files: true
          if-no-files-found: error
