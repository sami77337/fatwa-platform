name: Synthetic case follow-up browser acceptance
on:
  push:
    branches: [codex/20261107-case-followup-browser-qa]

permissions:
  contents: read

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGPORT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install application and browser-test dependencies
        run: |
          python -m pip install --only-binary=:all: --no-deps -r requirements.txt \
            playwright==1.62.0 pyee==13.0.1 greenlet==3.5.5
          python -m pip check
      - name: Follow a conflicting identity in the sandboxed browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/editorial-followup
          out=.local/editorial-followup
          git rev-parse HEAD > "$out/tested-sha.txt"
          test "$(cat "$out/tested-sha.txt")" = "$GITHUB_SHA"
          "$FATWA_FASTBUILD_BROWSER" --version > "$out/chrome-version.txt"
          if curl -fsS --max-time 1 http://127.0.0.1:8016/dev/editorial-followup -o /dev/null 2>/dev/null; then
            echo "Preview port already in use" >&2
            exit 1
          fi
          python -m apps.editorial_followup > "$out/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          curl -fsS -o /dev/null --retry 12 --retry-connrefused --retry-delay 1 --max-time 3 \
            http://127.0.0.1:8016/dev/editorial-followup
          kill -0 "$server_pid"
          python tests/editorial_followup/browser_smoke.py 2>&1 | tee "$out/browser.log"
          test -s "$out/desktop.png"
          test -s "$out/mobile.png"
      - name: Save the exact test receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: case-followup-browser
          if-no-files-found: error
          include-hidden-files: true
          path: .local/editorial-followup/
