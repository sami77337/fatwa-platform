name: FAST9 delivery operator queue
on:
  push:
    paths:
      - 'apps/editorial_workbench/delivery_operator.py'
      - 'apps/editorial_workbench/source_review_identity.py'
      - 'apps/editorial_workbench/reviewer_access.py'
      - 'apps/editorial_workbench/reviewer_desk.py'
      - 'apps/editorial_workbench/reviewer_server.py'
      - 'templates/editorial_workbench/delivery_operator.html'
      - 'tests/editorial_workbench/test_delivery_operator.py'
      - '.github/workflows/fast9-operator-queue.yml'
  pull_request:
    paths:
      - 'apps/editorial_workbench/delivery_operator.py'
      - 'apps/editorial_workbench/source_review_identity.py'
      - 'apps/editorial_workbench/reviewer_access.py'
      - 'apps/editorial_workbench/reviewer_desk.py'
      - 'apps/editorial_workbench/reviewer_server.py'
      - 'templates/editorial_workbench/delivery_operator.html'
      - 'tests/editorial_workbench/test_delivery_operator.py'
      - '.github/workflows/fast9-operator-queue.yml'
permissions:
  contents: read

jobs:
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FATWA_PRODUCTION: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Operator role and reconciliation form
        run: python manage.py test tests.editorial_workbench.test_delivery_operator --settings=config.settings.test --noinput --verbosity=2
