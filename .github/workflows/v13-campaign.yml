name: V13 connected audio citations research and recovery
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'config/**'
      - 'templates/**'
      - 'tests/casework/**'
      - 'tests/v13_security_review/**'
      - 'tests/v13_integration_security/**'
      - 'tests/v13_browser_startup/**'
      - 'tests/acceptance/fastbuild/**'
      - 'tests/research_bridge/**'
      - 'docs/product/v13_scope_evidence/**'
      - 'infra/dev/v13_verify.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/v13-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    env:
      FATWA_PRODUCTION: '0'
      FATWA_WAVE7_SYNTHETIC_WRITES: '1'
      DJANGO_SETTINGS_MODULE: config.settings.campaign_review
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PG_EXPECTED_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned runtime
        run: python -m pip install --no-deps -r requirements.txt
      # Match pg_dump/pg_restore to the service major; the runner default may be older.
      # Official packages: https://www.postgresql.org/download/linux/ubuntu/
      - name: Install matching PostgreSQL drill server and clients
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/fatwa-pgdg.asc
          test "$(gpg --batch --show-keys --with-colons /tmp/fatwa-pgdg.asc | awk -F: '$1 == "fpr" {print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 644 /tmp/fatwa-pgdg.asc /usr/share/keyrings/fatwa-pgdg.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/keyrings/fatwa-pgdg.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/fatwa-pgdg.list
          sudo apt-get update -qq
          sudo install -d /etc/postgresql-common
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf
          sudo apt-get install -y --no-install-recommends "postgresql-$PG_EXPECTED_MAJOR"
          printf '/usr/lib/postgresql/%s/bin\n' "$PG_EXPECTED_MAJOR" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser driver for the connected journey
        run: |
          python -m pip install --only-binary=:all: --no-deps playwright==1.62.0 pyee==13.0.1 greenlet==3.5.5
      - name: Verify V13 changed contracts and connected restored target with protected Chrome
        env:
          FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
          FATWA_BROWSER_SANDBOX: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python infra/dev/with_casework_postgres.py \
            --pg-bin "/usr/lib/postgresql/$PG_EXPECTED_MAJOR/bin" \
            --major "$PG_EXPECTED_MAJOR" --settings config.settings.campaign_review -- \
            python infra/dev/v13_verify.py --pg-bin "/usr/lib/postgresql/$PG_EXPECTED_MAJOR/bin" --browser \
            --label apps.browser_audio.test_boundaries \
            --label apps.browser_audio.test_browser \
            --label apps.timed_citations.tests \
            --label apps.classification_review.tests \
            --label apps.arabic_search_eval.test_ranking \
            --label apps.arabic_search_eval.test_services \
            --label tests.casework.test_v13_classification_wiring \
            --label tests.casework.test_v13_audio_wiring \
            --label tests.casework.test_v13_timed_bindings \
            --label tests.casework.test_v13_search_ui \
            --label tests.casework.test_v13_recovery_schema \
            --label tests.v13_integration_security.test_boundaries \
            --label tests.v13_integration_security.test_intake
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v13-pg${{ matrix.postgres }}
          path: |
            .local/qa/v13/pg${{ matrix.postgres }}
            .local/qa/v13/browser
          include-hidden-files: true
          if-no-files-found: error
