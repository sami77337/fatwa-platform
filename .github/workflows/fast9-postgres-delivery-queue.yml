name: FAST9 PostgreSQL delivery queue
on:
  pull_request:
    paths:
      - 'apps/delivery_queue/**'
      - 'tests/delivery_queue/**'
      - 'config/settings/delivery_queue_test.py'
      - '.github/workflows/fast9-postgres-delivery-queue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: wave7_synthetic
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: wave7_synthetic_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wave7_synthetic -d wave7_synthetic_queue"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FATWA_PRODUCTION: '0'
      FATWA_WAVE7_SYNTHETIC_WRITES: '1'
      DJANGO_SETTINGS_MODULE: config.settings.delivery_queue_test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: wave7_synthetic
      PGPASSWORD: synthetic-only
      PGDATABASE: wave7_synthetic_queue
      PGTESTDATABASE: test_wave7_synthetic_queue
      PG_EXPECTED_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-deps -r requirements.txt
      - name: Verify empty owned synthetic PostgreSQL target
        run: |
          python - <<'PY'
          import os
          import psycopg
          from django.conf import settings
          db=settings.DATABASES['default']
          assert db['NAME']=='wave7_synthetic_queue'
          assert db['USER']=='wave7_synthetic'
          assert db['HOST']=='127.0.0.1'
          with psycopg.connect(host=db['HOST'],port=db['PORT'],dbname=db['NAME'],user=db['USER'],password=os.environ['PGPASSWORD']) as con:
              assert con.execute("select current_setting('server_version_num')::int / 10000").fetchone()[0] == int(os.environ['PG_EXPECTED_MAJOR'])
              assert con.execute("select count(*) from pg_namespace where nspname not in ('pg_catalog','pg_toast','information_schema','public')").fetchone()[0] == 0
              assert con.execute("select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','v','m','S','f','p')").fetchone()[0] == 0
          import django
          django.setup()
          from apps.intake_workflow.guards import initialize_synthetic_database
          initialize_synthetic_database(synthetic_fixtures_only=True)
          PY
      - name: Migrate the isolated owned base schema required by the guarded runner
        run: python manage.py migrate --noinput --settings=config.settings.delivery_queue_test
      - name: Verify migration state matches models
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.delivery_queue_test
      - name: Apply isolated synthetic migrations and run concurrency suite
        run: python manage.py test tests.delivery_queue.test_postgres_queue tests.delivery_queue.test_signed_approval_bridge tests.delivery_queue.test_postgres_audit_attestation tests.delivery_queue.test_signed_provider_receipts --settings=config.settings.delivery_queue_test --noinput --verbosity=2
