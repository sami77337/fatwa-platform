name: FAST9 trusted delivery journey
on:
  pull_request:
    paths:
      - 'apps/delivery_queue/**'
      - 'apps/delivery_planner/**'
      - 'tests/delivery_queue/**'
      - 'config/settings/delivery_queue_test.py'
      - '.github/workflows/fast9-trusted-delivery-journey.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast9-trusted-journey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trusted-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: wave7_synthetic
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: wave7_synthetic_trusted_journey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wave7_synthetic -d wave7_synthetic_trusted_journey"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FATWA_PRODUCTION: '0'
      FATWA_WAVE7_SYNTHETIC_WRITES: '1'
      DJANGO_SETTINGS_MODULE: config.settings.delivery_queue_test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: wave7_synthetic
      PGPASSWORD: synthetic-only
      PGDATABASE: wave7_synthetic_trusted_journey
      PGTESTDATABASE: test_wave7_synthetic_trusted_journey
      PG_EXPECTED_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-deps -r requirements.txt
      - name: Verify source and compile changed modules
        run: |
          git rev-parse HEAD
          python -m compileall -q apps/delivery_queue tests/delivery_queue
      - name: Claim only the fresh isolated PostgreSQL database
        run: |
          python - <<'PY'
          import os, django
          django.setup()
          from django.db import connection
          from apps.intake_workflow.guards import initialize_synthetic_database
          with connection.cursor() as cursor:
              cursor.execute("SELECT current_setting('server_version_num')::int / 10000")
              assert cursor.fetchone()[0] == int(os.environ['PG_EXPECTED_MAJOR'])
          initialize_synthetic_database(synthetic_fixtures_only=True)
          PY
      - name: Apply isolated schema and check migration drift
        run: |
          python manage.py migrate --noinput --settings=config.settings.delivery_queue_test
          python manage.py makemigrations --check --dry-run --settings=config.settings.delivery_queue_test
      - name: PostgreSQL trusted journey and regression tests
        run: |
          set -euo pipefail
          mkdir -p .local/qa/trusted-journey
          python manage.py test tests.delivery_queue.test_postgres_queue tests.delivery_queue.test_signed_approval_bridge tests.delivery_queue.test_postgres_audit_attestation tests.delivery_queue.test_queue_regressions --settings=config.settings.delivery_queue_test --noinput --verbosity=2 2>&1 | tee .local/qa/trusted-journey/tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trusted-journey-pg${{ matrix.postgres }}
          path: .local/qa/trusted-journey
          include-hidden-files: true
          if-no-files-found: warn
