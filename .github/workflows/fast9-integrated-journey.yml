name: FAST9 integrated local development journey

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'tests/**'
      - 'templates/**'
      - 'static/**'
      - 'config/**'
      - 'contracts/**'
      - 'tools/**'
      - 'infra/dev/**'
      - 'manage.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FATWA_PRODUCTION: '0'
      DJANGO_SETTINGS_MODULE: config.settings.test
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PGHOST: '127.0.0.1'
      PGPORT: '1'
      PGCONNECT_TIMEOUT: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned runtime requirements
        run: python -m pip install --no-deps -r requirements.txt
      - name: Verify the single checkout used by both test commands
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Synthetic delivery, source journal and draft handoff services
        run: |
          python -m unittest \
            tests.delivery_planner.test_planner \
            tests.delivery_planner.test_approval \
            tests.delivery_planner.test_trusted_identity \
            tests.delivery_planner.test_segmentation \
            tests.delivery_planner.test_outbox \
            tests.delivery_planner.test_outbox_recovery \
            tests.delivery_planner.test_outbox_integrity \
            tests.fast9_case_source_join.test_source_history \
            tests.fast9_case_source_join.test_draft_source_review \
            tests.fast9_case_source_join.test_source_journal \
            tests.fast9_case_source_join.test_journal_cli \
            tests.fast9_case_source_join.test_internal_handoff \
            tests.fast9_case_source_join.test_return_handoff \
            -v
      - name: Requester, author, reviewer and operator screens with access boundaries
        run: |
          python manage.py test \
            tests.editorial_workbench.test_source_review \
            tests.editorial_workbench.test_source_journal_review \
            tests.editorial_workbench.test_desk_clarification \
            tests.editorial_workbench.test_requester_reply \
            tests.editorial_workbench.test_answer_editor \
            tests.editorial_workbench.test_answer_history \
            tests.editorial_workbench.test_delivery_operator \
            tests.editorial_workbench.test_return_preparation \
            --settings=config.settings.test --noinput --verbosity=2
      - name: Actual preparation browser acceptance in sandboxed system Chrome
        env:
          DJANGO_SETTINGS_MODULE: apps.editorial_workbench.reviewer_settings
          FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
        run: |
          python -m pip install --only-binary=:all: --no-deps playwright==1.62.0 pyee==13.0.1 greenlet==3.5.5
          python -m tests.editorial_workbench.return_preparation_browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fast9-return-preparation-browser
          path: .local/qa/fast9-integrated/return-preparation-browser.json
          include-hidden-files: true
          if-no-files-found: ignore
