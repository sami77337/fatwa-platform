name: Meta and Telegram signed intake (synthetic)
on:
  pull_request:
    paths:
      - 'apps/webhook_ingress/**'
      - 'apps/source_case_intake/adapters.py'
      - 'apps/source_case_intake/meta_projection.py'
      - 'config/campaign_urls.py'
      - 'config/settings/campaign_review.py'
      - '.github/workflows/webhook-ingress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    env:
      FATWA_PRODUCTION: '0'
      FATWA_WAVE7_SYNTHETIC_WRITES: '1'
      DJANGO_SETTINGS_MODULE: config.settings.campaign_review
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PG_EXPECTED_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned Python runtime
        run: python -m pip install --no-deps -r requirements.txt
      - name: Install exact isolated PostgreSQL major
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/fatwa-pgdg.asc
          test "$(gpg --batch --show-keys --with-colons /tmp/fatwa-pgdg.asc | awk -F: '$1 == "fpr" {print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 644 /tmp/fatwa-pgdg.asc /usr/share/keyrings/fatwa-pgdg.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/keyrings/fatwa-pgdg.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/fatwa-pgdg.list
          sudo apt-get update -qq
          sudo install -d /etc/postgresql-common
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf
          sudo apt-get install -y --no-install-recommends "postgresql-$PG_EXPECTED_MAJOR"
      - name: Verify signed callbacks, case separation and current rights
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p .local/qa/webhook-ingress
          python infra/dev/with_casework_postgres.py \
            --pg-bin "/usr/lib/postgresql/$PG_EXPECTED_MAJOR/bin" \
            --major "$PG_EXPECTED_MAJOR" --settings config.settings.campaign_review -- \
            python manage.py test apps.webhook_ingress.tests apps.source_case_intake.tests \
              --noinput --verbosity 2 2>&1 | tee ".local/qa/webhook-ingress/pg$PG_EXPECTED_MAJOR.log"
      - name: Install pinned Chromium driver for protected source review
        run: |
          python -m pip install --only-binary=:all: --no-deps playwright==1.62.0 pyee==13.0.1 greenlet==3.5.5
      - name: Protected native signed-source browser on exact isolated major
        env:
          FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
          FATWA_BROWSER_SANDBOX: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python infra/dev/with_casework_postgres.py \
            --pg-bin "/usr/lib/postgresql/$PG_EXPECTED_MAJOR/bin" \
            --major "$PG_EXPECTED_MAJOR" --settings config.settings.campaign_review -- \
            python manage.py test apps.webhook_ingress.browser_tests \
              --noinput --verbosity 2 2>&1 | tee ".local/qa/webhook-ingress/browser-pg$PG_EXPECTED_MAJOR.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path('.local/qa/webhook-ingress/browser')
          result = json.loads((folder / 'result.json').read_text())
          assert result['head_sha'] == os.environ['EXPECTED_SHA']
          assert result['sandbox'] is True
          assert result['native_rtl_widths'] == [320, 1280]
          assert result['external_requests'] == []
          assert result['page_errors'] == []
          assert result['current_review_scope_revoked'] is True
          for name in ('trace.zip', 'source-320.png', 'source-1280.png'):
              assert (folder / name).is_file()
              assert (folder / name).stat().st_size > 0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-webhook-pg${{ matrix.postgres }}
          path: .local/qa/webhook-ingress/
          include-hidden-files: true
          if-no-files-found: warn
