name: B6 committed integration QA
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  django-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/dev/qa.py system

  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres: [18, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-bookworm
        env:
          POSTGRES_USER: fatwa_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: b6_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fatwa_ci -d b6_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: fatwa_ci
      PGPASSWORD: ci_only_password
      PGDATABASE: b6_ephemeral
      PGTESTDATABASE: test_b6_ephemeral
      DJANGO_SETTINGS_MODULE: config.settings.test
      FATWA_PRODUCTION: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Confirm isolated PostgreSQL version
        env:
          EXPECTED_PG_MAJOR: ${{ matrix.postgres }}
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect() as connection:
              major = connection.info.server_version // 10000
              assert major == int(os.environ["EXPECTED_PG_MAJOR"]), (major, "unexpected version")
              with connection.cursor() as cursor:
                  cursor.execute("SELECT current_database()")
                  assert cursor.fetchone()[0] == "b6_ephemeral"
          PY
      - run: python manage.py check --database default --settings=config.settings.test
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: python manage.py migrate --noinput --settings=config.settings.test
      - run: python manage.py migrate --check --settings=config.settings.test
      - name: Diagnostic synthetic read requests
        run: |
          python manage.py shell --settings=config.settings.test <<'PY'
          from django.test import Client, RequestFactory
          from apps.reference.ingest import ingest_catalog
          from apps.reference.views import api_roots, api_search
          from tests.reference.test_catalog import fixture
          spec, rows = fixture()
          preview = ingest_catalog(spec, rows)
          ingest_catalog(spec, rows, dry_run=False, expected_checksum=preview.checksum)
          factory = RequestFactory()
          for label, route, handler in [
              ("roots", "/api/v1/fiqh/roots", api_roots),
              ("search", "/api/v1/fiqh/search?q=%D9%83%D8%AA%D8%A7%D8%A8", api_search),
          ]:
              req = factory.get(route)
              print("DIRECT_API", label, handler.__wrapped__(req).status_code, flush=True)
              print("CLIENT_API", label, Client().get(route).status_code, flush=True)
          PY
      - name: Django PostgreSQL integration tests
        run: >-
          python manage.py test
          tests/reference
          tests/public_site
          tests/security
          tests/integration/api
          tests/integration/ui
          tests.integration.source.test_read_only_commands
          tests.integration.test_site
          --noinput --settings=config.settings.test

  node-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests/dev -p 'test_*.py' -v
      - run: python tools/dev/qa.py node
