name: B6 committed integration QA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  django-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/dev/qa.py system
  postgresql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [18, 17]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/dev/qa.py postgres --postgres ${{ matrix.postgres }}
  node-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests/dev -p 'test_*.py' -v
      - run: python tools/dev/qa.py node
