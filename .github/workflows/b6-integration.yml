name: B6 committed integration QA
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  django-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/dev/qa.py system

  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres: [18, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-bookworm
        env:
          POSTGRES_USER: fatwa_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: b6_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fatwa_ci -d b6_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: fatwa_ci
      PGPASSWORD: ci_only_password
      PGDATABASE: b6_ephemeral
      PGTESTDATABASE: test_b6_ephemeral
      DJANGO_SETTINGS_MODULE: config.settings.test
      FATWA_PRODUCTION: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Record exact tested revision
        run: git rev-parse HEAD > b6-tested-sha.txt
      - name: Confirm isolated PostgreSQL version
        env:
          EXPECTED_PG_MAJOR: ${{ matrix.postgres }}
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect() as connection:
              major = connection.info.server_version // 10000
              assert major == int(os.environ["EXPECTED_PG_MAJOR"]), (major, "unexpected version")
              with connection.cursor() as cursor:
                  cursor.execute("SELECT current_database()")
                  assert cursor.fetchone()[0] == "b6_ephemeral"
          PY
      - run: python manage.py check --database default --settings=config.settings.test
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: python manage.py migrate --noinput --settings=config.settings.test
      - run: python manage.py migrate --check --settings=config.settings.test
      - name: Require nonzero actual E3 adapter collection
        if: ${{ !cancelled() }}
        run: |
          python - <<'PYCODE'
          import django
          django.setup()
          from django.test.runner import DiscoverRunner
          suite = DiscoverRunner().build_suite(['tests.reference_links_db.test_catalog_adapter'])
          assert suite.countTestCases() > 0, 'E3 missing/zero adapter cases fail'
          PYCODE
      - name: Django PostgreSQL integration tests
        shell: bash
        run: |
          set -o pipefail
          python manage.py test \
            tests/reference \
            tests/public_site \
            tests/security \
            tests/integration/api \
            tests/integration/ui \
            tests.integration.source.test_read_only_commands \
            tests.integration.test_site \
            tests.reference_links_db.test_catalog_adapter \
            --noinput --verbosity=2 --settings=config.settings.test 2>&1 | tee b6-postgres.log
      - name: Verify protected browser and E6 pure guards
        id: e6-preflight
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p .local/qa/e6
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          node --version
          python -m unittest tests.acceptance.wave6.test_guard -v
          python tools/dev/wave4_node.py tests/acceptance/wave6/cdp.test.mjs
      - name: Create E6 database on this disposable CI service only
        id: e6-db
        if: ${{ !cancelled() && steps.e6-preflight.outcome == 'success' }}
        run: |
          python - <<'PYCODE'
          import os
          import psycopg
          assert os.environ['PGHOST'] == '127.0.0.1'
          assert os.environ['PGDATABASE'] == 'b6_ephemeral'
          with psycopg.connect(dbname='postgres', autocommit=True) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT datname FROM pg_database WHERE datname = 'e6_synthetic'")
                  assert cursor.fetchone() is None, 'E6 refuses an occupied database'
                  cursor.execute('CREATE DATABASE e6_synthetic')
          PYCODE
      - name: E6 actual service gate
        id: e6-service
        if: ${{ !cancelled() && steps.e6-db.outcome == 'success' }}
        env:
          E6_SYNTHETIC_ONLY: '1'
          PGDATABASE: e6_synthetic
          PGTESTDATABASE: test_e6_synthetic
          E6_BROWSER: /usr/bin/google-chrome
          E6_ARTIFACTS: ${{ github.workspace }}/.local/qa/e6
        shell: bash
        run: |
          set -o pipefail
          python tests/acceptance/wave6/run.py 2>&1 | tee .local/qa/e6/service.log
          python - <<'PYCODE'
          from pathlib import Path
          import re
          text = Path('.local/qa/e6/service.log').read_text(encoding='utf-8')
          assert re.search(r'(?m)^Ran ([1-9][0-9]*) tests? in ', text), 'E6 zero/unreported cases fail'
          PYCODE
      - name: E6 actual assets gate
        id: e6-assets
        if: ${{ !cancelled() && steps.e6-service.outcome == 'success' }}
        env:
          E6_SYNTHETIC_ONLY: '1'
          PGDATABASE: e6_synthetic
          PGTESTDATABASE: test_e6_synthetic
          E6_BROWSER: /usr/bin/google-chrome
          E6_ARTIFACTS: ${{ github.workspace }}/.local/qa/e6
        shell: bash
        run: |
          set -o pipefail
          python tests/acceptance/wave6/run.py --assets 2>&1 | tee .local/qa/e6/assets.log
          python - <<'PYCODE'
          from pathlib import Path
          import re
          text = Path('.local/qa/e6/assets.log').read_text(encoding='utf-8')
          assert re.search(r'(?m)^Ran ([1-9][0-9]*) tests? in ', text), 'E6 zero/unreported cases fail'
          PYCODE
      - name: E6 actual review-batches gate
        id: e6-review-batches
        if: ${{ !cancelled() && steps.e6-service.outcome == 'success' }}
        env:
          E6_SYNTHETIC_ONLY: '1'
          PGDATABASE: e6_synthetic
          PGTESTDATABASE: test_e6_synthetic
          E6_BROWSER: /usr/bin/google-chrome
          E6_ARTIFACTS: ${{ github.workspace }}/.local/qa/e6
        shell: bash
        run: |
          set -o pipefail
          python tests/acceptance/wave6/run.py --review-batches 2>&1 | tee .local/qa/e6/review-batches.log
          python - <<'PYCODE'
          from pathlib import Path
          import re
          text = Path('.local/qa/e6/review-batches.log').read_text(encoding='utf-8')
          assert re.search(r'(?m)^Ran ([1-9][0-9]*) tests? in ', text), 'E6 zero/unreported cases fail'
          PYCODE
      - name: E6 actual regressions gate
        id: e6-regressions
        if: ${{ !cancelled() && steps.e6-service.outcome == 'success' }}
        env:
          E6_SYNTHETIC_ONLY: '1'
          PGDATABASE: e6_synthetic
          PGTESTDATABASE: test_e6_synthetic
          E6_BROWSER: /usr/bin/google-chrome
          E6_ARTIFACTS: ${{ github.workspace }}/.local/qa/e6
        shell: bash
        run: |
          set -o pipefail
          python tests/acceptance/wave6/run.py --regressions 2>&1 | tee .local/qa/e6/regressions.log
          python - <<'PYCODE'
          from pathlib import Path
          import re
          text = Path('.local/qa/e6/regressions.log').read_text(encoding='utf-8')
          assert re.search(r'(?m)^Ran ([1-9][0-9]*) tests? in ', text), 'E6 zero/unreported cases fail'
          PYCODE
      - name: E6 actual browser gate
        id: e6-browser
        if: ${{ !cancelled() && steps.e6-service.outcome == 'success' }}
        env:
          E6_SYNTHETIC_ONLY: '1'
          PGDATABASE: e6_synthetic
          PGTESTDATABASE: test_e6_synthetic
          E6_BROWSER: /usr/bin/google-chrome
          E6_ARTIFACTS: ${{ github.workspace }}/.local/qa/e6
        shell: bash
        run: |
          set -o pipefail
          python tests/acceptance/wave6/run.py --browser --review-batches 2>&1 | tee .local/qa/e6/browser.log
          python - <<'PYCODE'
          from pathlib import Path
          import re
          text = Path('.local/qa/e6/browser.log').read_text(encoding='utf-8')
          assert re.search(r'(?m)^Ran ([1-9][0-9]*) tests? in ', text), 'E6 zero/unreported cases fail'
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b6-postgres-${{ matrix.postgres }}
          path: |
            b6-tested-sha.txt
            b6-postgres.log
            .local/qa/e6/
          include-hidden-files: true
          if-no-files-found: error

  node-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests/dev -p 'test_*.py' -v
      - run: python tools/dev/qa.py node

  wave7-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: [18, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-bookworm
        env:
          POSTGRES_USER: wave7_synthetic
          POSTGRES_PASSWORD: ci_synthetic_only
          POSTGRES_DB: wave7_synthetic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wave7_synthetic -d wave7_synthetic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FATWA_PRODUCTION: '0'
      FATWA_WAVE7_SYNTHETIC_WRITES: '1'
      DJANGO_SETTINGS_MODULE: config.settings.wave7_test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: wave7_synthetic
      PGPASSWORD: ci_synthetic_only
      PGDATABASE: wave7_synthetic_ci
      PGTESTDATABASE: test_wave7_synthetic_ci
      EXPECTED_WAVE7_PG_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install --no-deps -r requirements.txt
      - name: Verify identity then claim only this empty synthetic service
        run: |
          python - <<'PYCODE'
          import json, os, subprocess, sys
          from pathlib import Path
          import django
          django.setup()
          from django.db import connection
          from apps.intake_workflow.guards import validate_write_configuration, initialize_synthetic_database
          target = validate_write_configuration(synthetic_fixtures_only=True)
          with connection.cursor() as cursor:
              cursor.execute("SELECT current_database(), current_user, current_setting('server_version_num')::int")
              name, role, version = cursor.fetchone()
          assert name == 'wave7_synthetic_ci' and role == 'wave7_synthetic'
          assert version // 10000 == int(os.environ['EXPECTED_WAVE7_PG_MAJOR'])
          context = initialize_synthetic_database(synthetic_fixtures_only=True)
          path = Path('.local/qa/wave7-foundation')
          path.mkdir(parents=True, exist_ok=True)
          (path / 'identity.json').write_text(json.dumps({
              'sha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'python': sys.version, 'postgres': version, 'database': name, 'role': role,
              'scope': context.scope, 'source_acceptance': 'NOT_RUN',
              'gates': 'NOT_DEPLOYED / GATES_HOLD'}, indent=2)+'\n')
          PYCODE
      - run: python manage.py check --database default --settings=config.settings.wave7_test
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.wave7_test
      - run: python manage.py migrate --noinput --settings=config.settings.wave7_test
      - run: python manage.py migrate --check --settings=config.settings.wave7_test
      - run: python manage.py showmigrations intake_workflow --settings=config.settings.wave7_test
      - name: Actual Wave7 PostgreSQL foundation tests
        shell: bash
        run: |
          set -o pipefail
          python manage.py test tests.wave7_foundation.test_database tests.wave7_foundation.test_review_regressions tests.wave7_foundation.test_lossless_db --noinput --verbosity=2 --settings=config.settings.wave7_test 2>&1 | tee .local/qa/wave7-foundation/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave7-foundation-postgres-${{ matrix.postgres }}
          path: .local/qa/wave7-foundation/
          include-hidden-files: true
          if-no-files-found: error
