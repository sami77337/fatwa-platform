name: C6 integrated pure and full importer QA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Dispatcher regressions
        run: python -m unittest discover -s tests/dev -p 'test_*.py' -v
      - name: FAST8 explicit offline suites and cross-lane identity contracts
        run: >-
          python -B manage.py test
          tests.fast8_acceptance_evidence.test_cli
          tests.fast8_acceptance_evidence.test_services
          tests.fast8_case_permission.test_cli
          tests.fast8_case_permission.test_services
          tests.fast8_case_references.test_cli
          tests.fast8_case_references.test_services
          tests.fast8_fiqh_navigation.test_cli
          tests.fast8_fiqh_navigation.test_django_adapter
          tests.fast8_fiqh_navigation.test_preflight
          tests.fast8_fiqh_navigation.test_services
          tests.fast8_ingest_adversarial.test_boundaries
          tests.fast8_ingest_adversarial.test_cli_fail_closed
          tests.fast8_ingest_adversarial.test_transcript_revisions
          tests.fast8_intake_recovery.test_cli
          tests.fast8_intake_recovery.test_services
          tests.fast8_journey_conformance.test_cli
          tests.fast8_journey_conformance.test_http
          tests.fast8_journey_conformance.test_services
          tests.fast8_operator_nav.test_views
          tests.fast8_packet_verifier.test_cli
          tests.fast8_packet_verifier.test_services
          tests.fast8_permission_probes.test_runner
          tests.fast8_prepared_review.test_cli
          tests.fast8_prepared_review.test_services
          tests.fast8_review_export.test_cli
          tests.fast8_review_export.test_services
          tests.fast8_segment_timeline.test_cli
          tests.fast8_segment_timeline.test_service
          tests.fast8_source_preflight.test_cli
          tests.fast8_source_preflight.test_service
          tests.fast8_transcript_queue.test_cli
          tests.fast8_transcript_queue.test_contracts
          tests.fast8_transcript_queue.test_services
          tests.integration.test_fast8 tests.integration.test_fast8_mount
          tests.integration.test_fast8_diagnostics
          --settings=config.settings.test --noinput --verbosity=2
      - name: FAST7B+C eight-lane suites and exact identity compatibility
        run: >-
          python -B manage.py test
          tests.editorial_queue.test_cross_batch tests.editorial_queue.test_review_filters
          tests.editorial_queue.test_services tests.editorial_queue.test_views
          tests.editorial_search.test_services tests.editorial_search.test_views
          tests.editorial_export.test_cli tests.editorial_export.test_comparison
          tests.editorial_export.test_comparison_cli tests.editorial_export.test_services
          tests.editorial_export.test_views
          tests.fiqh_reading_trail.test_boundaries tests.fiqh_reading_trail.test_cli
          tests.fiqh_reading_trail.test_services
          tests.revision_lineage_inspector.test_cli tests.revision_lineage_inspector.test_inspector
          tests.arabic_text_quality.test_cli tests.arabic_text_quality.test_dependencies
          tests.arabic_text_quality.test_service
          tests.editorial_duplicate_candidates.test_cli
          tests.editorial_duplicate_candidates.test_normalization
          tests.editorial_duplicate_candidates.test_services
          tests.acceptance.fastbuild.test_runner tests.acceptance.fastbuild.test_browser_supervisor
          tests.acceptance.fastbuild.test_process_probe
          tests.integration.test_fast7bc
          --settings=config.settings.test --noinput --verbosity=2
      - name: FAST7B guarded browser startup and request policy
        run: python tools/dev/wave4_node.py tests/acceptance/fastbuild/startup.test.mjs tests/acceptance/fastbuild/policy.test.mjs
      - name: FAST6 combined offline engines, bridges and guarded HTTP
        run: >-
          python -B manage.py test
          tests.workflow_invariants.test_engine tests.workflow_invariants.test_cli
          tests.policy_gap_engine.test_evidence tests.policy_gap_engine.test_services tests.policy_gap_engine.test_cli
          tests.source_readiness.test_service tests.source_readiness.test_cli
          tests.fast6_journey.test_services tests.fast6_journey.test_cli
          tests.fast6_journey.test_http tests.fast6_journey.test_integration
          tests.workflow_rehearsal.test_services tests.workflow_rehearsal.test_views
          tests.editorial_export.test_services tests.integration.test_fast5
          --settings=config.settings.test --noinput --verbosity=2
      - name: Require every actual Wave7 pure module and nonzero execution
        run: python -B tools/dev/wave7_qa.py --suite pure --json .local/qa/c6/wave7-pure.json
      - name: E2 default-off boundary with unreachable database
        run: python -B tools/dev/wave7_qa.py --suite editorial-off --json .local/qa/c6/wave7-editorial-off.json
      - name: E4 default-off API and service contracts with unreachable database
        run: python -B tools/dev/wave7_qa.py --suite workflow-off --json .local/qa/c6/wave7-workflow-off.json
      - name: E6 actual CDP and native keyboard regressions
        run: python tools/dev/wave4_node.py tests/acceptance/wave7/cdp.test.mjs tests/acceptance/wave7/keyboard.test.mjs
      - name: Require nonzero E6 exact reference negative regressions
        run: python tools/dev/wave4_node.py tests/acceptance/wave7/reference_assertions.test.mjs
      - name: Require C1 C2 C3 and complete importer collection
        run: python tools/dev/wave3_qa.py --standalone --require-integrated --reports .local/qa/c6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c6-${{ matrix.os }}
          path: .local/qa/c6/*.json
          include-hidden-files: true
          if-no-files-found: error
