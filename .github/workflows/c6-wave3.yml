name: C6 integrated pure and full importer QA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Dispatcher regressions
        run: python -m unittest discover -s tests/dev -p 'test_*.py' -v
      - name: Require every actual Wave7 pure module and nonzero execution
        run: python -B tools/dev/wave7_qa.py --suite pure --json .local/qa/c6/wave7-pure.json
      - name: E2 default-off boundary with unreachable database
        run: python -B tools/dev/wave7_qa.py --suite editorial-off --json .local/qa/c6/wave7-editorial-off.json
      - name: E6 actual CDP and native keyboard regressions
        run: python tools/dev/wave4_node.py tests/acceptance/wave7/cdp.test.mjs tests/acceptance/wave7/keyboard.test.mjs
      - name: Require nonzero E6 exact reference negative regressions
        run: python tools/dev/wave4_node.py tests/acceptance/wave7/reference_assertions.test.mjs
      - name: Require C1 C2 C3 and complete importer collection
        run: python tools/dev/wave3_qa.py --standalone --require-integrated --reports .local/qa/c6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c6-${{ matrix.os }}
          path: .local/qa/c6/*.json
          include-hidden-files: true
          if-no-files-found: error
