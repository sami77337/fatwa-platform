name: FAST9 synthetic approval and delivery outbox
on:
  push:
    paths:
      - 'apps/delivery_planner/**'
      - 'tests/delivery_planner/**'
      - '.github/workflows/fast9-delivery-outbox.yml'
  pull_request:
    paths:
      - 'apps/delivery_planner/**'
      - 'tests/delivery_planner/**'
      - '.github/workflows/fast9-delivery-outbox.yml'
permissions:
  contents: read

jobs:
  outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FATWA_PRODUCTION: '0'
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Approval signature boundary and persistent outbox
        run: |
          python -m unittest tests.delivery_planner.test_approval tests.delivery_planner.test_outbox tests.delivery_planner.test_planner -v
