name: FAST9 Wave7 case-policy PostgreSQL
on:
  push:
    branches: [codex/20261029-fast9-v5-04-policy-pc1]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-bookworm
        env:
          POSTGRES_DB: wave7_synthetic_fast9_case_policy_join
          POSTGRES_USER: wave7_synthetic
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, matrix.postgres) }}
        ports: ['127.0.0.1:55439:5432']
        options: >-
          --health-cmd "pg_isready -U wave7_synthetic -d wave7_synthetic_fast9_case_policy_join"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.wave7_test
      FATWA_PRODUCTION: '0'
      FATWA_WAVE7_SYNTHETIC_WRITES: '1'
      PGHOST: 127.0.0.1
      PGPORT: '55439'
      PGDATABASE: wave7_synthetic_fast9_case_policy_join
      PGTESTDATABASE: test_wave7_synthetic_fast9_case_policy_join
      PGUSER: wave7_synthetic
      PGPASSWORD: ${{ format('ci-{0}-{1}', github.run_id, matrix.postgres) }}
      EXPECTED_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --no-deps -r requirements.txt
      - name: Claim the reserved empty service using Wave7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/policy"
          python -B - <<'PY' | tee "$RUNNER_TEMP/policy/base-before.json"
          import django
          django.setup()
          import json, os
          from django.db import connection
          from apps.intake_workflow.guards import initialize_synthetic_database
          from tools.fast9_case_policy_join.postgres_check import BASE, EXPECTED
          assert all(os.environ.get(k) == v for k, v in EXPECTED.items())
          with connection.cursor() as c:
              c.execute("SELECT current_database(), current_user, current_setting('server_version_num')::int, oid, datdba=current_user::regrole FROM pg_database WHERE datname=current_database()")
              name, role, version, oid, owns = c.fetchone()
              assert (name, role, version // 10000, owns) == (BASE, EXPECTED['PGUSER'], int(os.environ['EXPECTED_MAJOR']), True)
              c.execute("SELECT 1 FROM pg_database WHERE datname=%s", [EXPECTED['PGTESTDATABASE']])
              assert c.fetchone() is None
          ctx = initialize_synthetic_database(synthetic_fixtures_only=True)
          assert (ctx.database_name, ctx.database_oid) == (name, oid)
          print(json.dumps(dict(sha=os.environ['GITHUB_SHA'], name=name, role=role, version=version, oid=oid, test_absent=True)))
          PY
          python -B manage.py migrate --noinput --settings=config.settings.wave7_test
      - name: Run the read-only case-policy check and verify teardown
        shell: bash
        run: |
          set -euo pipefail
          python -B -m tools.fast9_case_policy_join.postgres_check --preauthorized-disposable-only 2>&1 | tee "$RUNNER_TEMP/policy/test.log"
          python -B - <<'PY'
          import django
          django.setup()
          import json, os
          from pathlib import Path
          from django.db import connection
          from apps.intake_workflow.guards import require_synthetic_write
          from tools.fast9_case_policy_join.postgres_check import EXPECTED
          dest = Path(os.environ['RUNNER_TEMP']) / 'policy'
          base = json.loads((dest / 'base-before.json').read_text())
          lines = (dest / 'test.log').read_text().splitlines()
          marks = [json.loads(s.removeprefix('FAST9_POLICY ')) for s in lines if s.startswith('FAST9_POLICY ')]
          assert len(marks) == 1 and json.loads(lines[-1])['postgres'] == 'PASS'
          assert marks[0]['database'] == EXPECTED['PGTESTDATABASE'] and marks[0]['oid'] != base['oid']
          assert any(s.startswith('Ran 1 test in ') for s in lines) and 'OK' in lines
          ctx = require_synthetic_write(synthetic_fixtures_only=True)
          assert (ctx.database_name, ctx.database_oid) == (base['name'], base['oid'])
          with connection.cursor() as c:
              c.execute("SELECT 1 FROM pg_database WHERE datname=%s", [EXPECTED['PGTESTDATABASE']])
              assert c.fetchone() is None
          (dest / 'result.json').write_text(json.dumps(dict(base=base, test=marks[0], test_absent_after=True,
              result='PASS_SYNTHETIC_NON_MUTATION', cases=1), indent=2))
          PY
      - name: Retain version-specific proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fast9-case-policy-pg${{ matrix.postgres }}
          path: ${{ runner.temp }}/policy/
          if-no-files-found: error
