name: Transcript binding campaign integration
on:
  pull_request:
    paths:
      - 'apps/transcript_case_links/**'
      - 'apps/fast8_transcript_queue/**'
      - 'tools/transcript_pipeline/**'
      - 'apps/team_updates/**'
      - 'apps/casework/**'
      - 'apps/casework_web/**'
      - 'apps/mufti_review/identity.py'
      - 'templates/casework/**'
      - 'apps/team_workspace/**'
      - 'apps/requester_team_journey/**'
      - 'apps/requester_access_review/**'
      - 'apps/case_delivery_desk/**'
      - 'config/campaign_urls.py'
      - 'config/settings/campaign_review.py'
      - 'tests/casework/**'
      - '.github/workflows/transcript-case-binding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transcript-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: wave7_synthetic
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: wave7_synthetic_transcripts
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wave7_synthetic -d wave7_synthetic_transcripts"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FATWA_PRODUCTION: '0'
      FATWA_WAVE7_SYNTHETIC_WRITES: '1'
      DJANGO_SETTINGS_MODULE: config.settings.campaign_review
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: wave7_synthetic
      PGPASSWORD: synthetic-only
      PGDATABASE: wave7_synthetic_transcripts
      PGTESTDATABASE: test_wave7_synthetic_transcripts
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PG_EXPECTED_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned runtime
        run: python -m pip install --no-deps -r requirements.txt ruff==0.17.0
      - name: Initialize owned schema and check migrations
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p .local/qa/transcript-case-binding
          python - <<'PY'
          import os
          import django
          django.setup()
          from django.db import connection
          from apps.intake_workflow.guards import initialize_synthetic_database
          with connection.cursor() as cursor:
              cursor.execute("SELECT current_setting('server_version_num')::int / 10000")
              assert str(cursor.fetchone()[0]) == os.environ['PG_EXPECTED_MAJOR']
          initialize_synthetic_database(synthetic_fixtures_only=True)
          PY
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
          python manage.py check
          ruff check apps/transcript_case_links tests/casework/test_campaign_transcripts.py
      - name: Canonical campaign isolation and state contracts
        run: |
          set -euo pipefail
          python manage.py test apps.transcript_case_links.tests tests.casework.test_campaign_transcripts apps.team_updates.compat_review_tests apps.team_updates.tests tests.casework.test_campaign tests.casework.test_campaign_access tests.casework.test_campaign_updates tests.casework.test_campaign_delivery --noinput --verbosity 2 2>&1 | tee .local/qa/transcript-case-binding/tests.log
      - name: Native upload journey in sandboxed Chrome
        if: matrix.postgres == '17'
        env:
          FATWA_FASTBUILD_BROWSER: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --no-deps playwright==1.62.0 pyee==13.0.1 greenlet==3.5.5
          python manage.py test apps.transcript_case_links.browser_tests --noinput --verbosity 2 2>&1 | tee .local/qa/transcript-case-binding/browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: transcript-case-binding-pg${{ matrix.postgres }}
          path: .local/qa/transcript-case-binding
          include-hidden-files: true
          if-no-files-found: error
