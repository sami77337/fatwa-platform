name: Actual upload scan engine
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clamav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the actual scanner and official updater
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          # Only this disposable runner is changed. No daemon is started.
          sudo systemctl mask --runtime clamav-freshclam.service clamav-freshclam-once.service clamav-freshclam-once.timer
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clamav clamav-freshclam
          mkdir -p .local/qa/upload-security-engine
          dpkg-query -W clamav clamav-freshclam > .local/qa/upload-security-engine/packages.txt
      - name: Acquire fresh signed official databases once
        run: |
          set -euo pipefail
          # FreshClam verifies official databases. No custom mirror, unsigned
          # signatures, renamed CLD files or fallback download is accepted.
          # https://docs.clamav.net/manual/Usage/SignatureManagement.html
          python - <<'PY'
          import getpass, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'fatwa-upload-engine'
          download = root / 'download'
          download.mkdir(parents=True, exist_ok=True)
          (root / 'snapshot').mkdir(exist_ok=True)
          (root / 'freshclam.conf').write_text('\n'.join([
              'DatabaseDirectory ' + str(download),
              'DatabaseOwner ' + getpass.getuser(),
              'DatabaseMirror database.clamav.net',
              'Foreground yes', 'MaxAttempts 1',
              'ConnectTimeout 30', 'ReceiveTimeout 60',
              'TestDatabases yes', 'Bytecode yes', '',
          ]))
          PY
          mkdir -p .local/qa/upload-security-engine
          timeout 300 freshclam --config-file="$RUNNER_TEMP/fatwa-upload-engine/freshclam.conf" > .local/qa/upload-security-engine/freshclam.log 2>&1
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'fatwa-upload-engine'
          for name in ('main.cvd', 'daily.cvd', 'bytecode.cvd'):
              source = root / 'download' / name
              if not source.is_file() or source.is_symlink():
                  raise SystemExit('Required official CVD snapshot unavailable')
              target = root / 'snapshot' / name
              shutil.copyfile(source, target)
              target.chmod(0o444)
          (root / 'snapshot').chmod(0o555)
          PY
      - name: Prove benign admission and EICAR rejection with the real engine
        if: always()
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          output = Path('.local/qa/upload-security-engine/result.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != os.environ['EXPECTED_SHA']:
              raise SystemExit('Source does not match the requested review head')
          command = [
              sys.executable, '-m', 'apps.upload_security.acceptance',
              '--executable', '/usr/bin/clamscan',
              '--database-directory', str(Path(os.environ['RUNNER_TEMP']) / 'fatwa-upload-engine/snapshot'),
              '--signature-source', 'https://database.clamav.net',
              '--max-daily-age-days', '2', '--memory-bytes', '2147483648',
              '--timeout-seconds', '30', '--output', str(output),
          ]
          completed = subprocess.run(command, check=False, timeout=90)
          if not output.is_file():
              raise SystemExit('Scanner evidence was not written')
          evidence = json.loads(output.read_text())
          evidence.update(tested_sha=head, deployment='NOT_DEPLOYED', main_merged=False,
                          workflow_run_id=os.environ['GITHUB_RUN_ID'],
                          workflow_run_attempt=os.environ['GITHUB_RUN_ATTEMPT'])
          output.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          if completed.returncode or evidence.get('status') != 'PASSED' or evidence.get('real_engine_verified') is not True:
              raise SystemExit(completed.returncode or 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-upload-scan-engine
          path: .local/qa/upload-security-engine
          include-hidden-files: true
          if-no-files-found: error
