{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  {% if withhold_preview %}
    <meta name="robots" content="noindex">
  {% else %}
    <meta name="description" content="{{ page_description }}">
  {% endif %}
  {% if canonical_url %}
    <link rel="canonical" href="{{ canonical_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ page_description }}">
    <meta property="og:url" content="{{ canonical_url }}">
  {% endif %}
  <link rel="stylesheet" href="{% static 'reference/style.css' %}">
</head>
<body>
  <a class="skip-link" href="#main-content">انتقل إلى المحتوى</a>
  <header>
    <p>الفهرس الفقهي</p>
    <nav aria-label="التنقل الرئيسي">
      <a href="{% url 'home' %}"{% if current_page == 'home' %} aria-current="page"{% endif %}>الرئيسية</a>
      <a href="{% url 'catalog' %}?basic=1">تصفح الفهرس</a>
      <a href="{% url 'public_help' %}"{% if current_page == 'help' %} aria-current="page"{% endif %}>دليل الاستخدام والمصدر</a>
    </nav>
  </header>
  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>نسخة تطوير للقراءة فقط. المحتوى عناوين مرجعية، وليست فتاوى منشورة.</p>
  </footer>
</body>
</html>
