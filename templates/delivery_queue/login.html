<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>دخول متابعة التسليم</title><link rel="stylesheet" href="/review/operator/queue.css"></head>
<body><main><h1>دخول مشغّل التسليم</h1><p class="note">بيئة تدريب محلية. لا إرسال أو نشر من هذه الشاشة.</p>
{% if message %}<p role="alert">{{ message }}</p>{% endif %}
<form method="post">{% csrf_token %}<label for="operator-token">رمز المشغّل</label><input id="operator-token" name="token" type="password" required maxlength="64" autocomplete="current-password" dir="ltr"><button type="submit">فتح المتابعة</button></form>
</main></body></html>
