<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>دخول المفتي إلى المراجعة</title><link rel="stylesheet" href="/review/author/approval/desk.css"></head><body><main><h1>دخول المفتي إلى المراجعة</h1><p class="note">يتحقق الخادم من الدور ونطاق القضايا وحالة الهوية. حساب المؤلف أو المراجع الفني لا يمنح صلاحية المفتي. لا يُطلب مفتاح توقيع خاص.</p>{% if message %}<p role="alert">{{ message }}</p>{% endif %}<form method="post">{% csrf_token %}<label for="mufti-credential">بيان الدخول الصادر عن جهة الهوية المهيأة</label><input id="mufti-credential" name="credential" type="password" maxlength="1024" required autocomplete="current-password" dir="ltr"><button type="submit">دخول المفتي</button></form></main></body></html>
